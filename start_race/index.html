<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>친구와 여행 성향 테스트</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    h2 {
      font-size: 22px;
      line-height: 1.5;
    }

    p {
      line-height: 1.6;
      color: #4b5563;
    }

    input,
    button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border-radius: 12px;
      margin-top: 12px;
    }

    input {
      border: 1px solid #d1d5db;
    }

    button {
      border: none;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    .answer-button {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #e5e7eb;
    }

    .answer-button:hover {
      background: #e5e7eb;
    }

    .progress {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .error {
      color: #dc2626;
      margin-top: 10px;
      font-size: 14px;
    }

    .mission {
      border: 2px dashed #111827;
      border-radius: 16px;
      padding: 18px;
      margin-top: 20px;
      background: #fafafa;
    }

    .mission strong {
      display: block;
      font-size: 18px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" id="app">
      <h1>친구와 여행 성향 테스트</h1>
      <p>
        친구들과 여행할 때 나는 어떤 스타일일까요?
        이름을 입력하고 간단한 테스트를 진행해보세요.
      </p>

      <input
        id="nameInput"
        type="text"
        maxlength="1"
        placeholder="이름 입력: A ~ H"
        autocomplete="off"
      />

      <button onclick="startTest()">테스트 시작</button>
      <div class="error" id="errorMessage"></div>
    </div>
  </div>

  <script>
    const allowedNames = ["A", "B", "C", "D", "E", "F", "G", "H"];

    const questions = [
      "여행 전 일정을 미리 계획하는 편이다.",
      "여행지에서는 유명한 장소보다 새로운 장소를 발견하는 것이 좋다.",
      "맛집이라면 어느 정도 기다릴 수 있다.",
      "여행 중 갑작스러운 일정 변경도 재미있다고 생각한다.",
      "친구들과 여행할 때 내가 먼저 의견을 내는 편이다.",
      "숙소의 편안함은 여행에서 꽤 중요하다.",
      "여행 중 사진이나 영상을 많이 남기는 편이다.",
      "액티비티가 많을수록 여행이 더 재미있다.",
      "여행 중 혼자 쉬는 시간도 필요하다.",
      "게임이나 내기가 있으면 승부욕이 생긴다."
    ];

    const answers = [
      { text: "매우 그렇다", score: 3 },
      { text: "그렇다", score: 2 },
      { text: "보통이다", score: 1 },
      { text: "아니다", score: 0 }
    ];

    let userName = "";
    let questionIndex = 0;
    let score = 0;
    let missionShown = false;

    function startTest() {
      const input = document.getElementById("nameInput");
      const error = document.getElementById("errorMessage");

      userName = input.value.trim().toUpperCase();

      if (!allowedNames.includes(userName)) {
        error.textContent = "등록되지 않은 이름입니다. A부터 H까지만 입력할 수 있습니다.";
        return;
      }

      questionIndex = 0;
      score = 0;
      missionShown = false;
      renderQuestion();
    }

    function renderQuestion() {
      const app = document.getElementById("app");

      // 테스트용 개인 미션
      // C는 4번 문제 이후
      // F는 7번 문제 이후
      if (!missionShown && userName === "C" && questionIndex === 4) {
        missionShown = true;
        renderMission("목적지 도착 전 뜨거운 아메리카노를 한 잔 구매하세요.");
        return;
      }

      if (!missionShown && userName === "F" && questionIndex === 7) {
        missionShown = true;
        renderMission("목적지 도착 전 화장실을 총 3회 방문하세요.");
        return;
      }

      if (questionIndex >= questions.length) {
        showResult();
        return;
      }

      const buttons = answers.map(answer => `
        <button
          class="answer-button"
          onclick="selectAnswer(${answer.score})"
        >
          ${answer.text}
        </button>
      `).join("");

      app.innerHTML = `
        <div class="progress">
          ${questionIndex + 1} / ${questions.length}
        </div>

        <h2>${questions[questionIndex]}</h2>

        ${buttons}
      `;
    }

    function selectAnswer(answerScore) {
      score += answerScore;
      questionIndex += 1;
      renderQuestion();
    }

    function renderMission(missionText) {
      const app = document.getElementById("app");

      app.innerHTML = `
        <div class="progress">추가 성향 확인</div>

        <h2>${userName}님을 위한 추가 테스트가 있습니다.</h2>

        <p>
          정확한 여행 성향 분석을 위해 아래 조건을 확인해주세요.
        </p>

        <div class="mission">
          <strong>추가 행동 테스트</strong>
          ${missionText}
        </div>

        <p>
          다른 참가자에게 이 내용을 보여주거나 설명하지 마세요.
        </p>

        <button onclick="continueTest()">확인했습니다</button>
      `;
    }

    function continueTest() {
      renderQuestion();
    }

    function showResult() {
      const app = document.getElementById("app");

      let type = "";
      let description = "";

      if (score >= 23) {
        type = "도전형 여행자";
        description = "새로운 경험과 활동을 즐기며 여행에서 적극적으로 움직이는 스타일입니다.";
      } else if (score >= 14) {
        type = "균형형 여행자";
        description = "계획과 즉흥, 휴식과 활동을 적절히 섞어 즐기는 스타일입니다.";
      } else {
        type = "여유형 여행자";
        description = "편안한 분위기와 여유로운 일정을 중요하게 생각하는 스타일입니다.";
      }

      app.innerHTML = `
        <h1>${userName}님의 여행 성향</h1>
        <h2>${type}</h2>
        <p>${description}</p>

        <button onclick="location.reload()">처음으로 돌아가기</button>
      `;
    }
  </script>
</body>
</html>
