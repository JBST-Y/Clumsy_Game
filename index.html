<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우당탕탕 추리게임 DEMO - 간단 링크</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #090a10;
      color: #f7f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(680px, 100%);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 24px;
      padding: 24px;
    }
    h1 { margin: 0 0 10px; }
    p { color: #b8bfd1; line-height: 1.65; }
    .grid { display: grid; gap: 12px; margin-top: 20px; }
    a {
      display: block;
      padding: 16px;
      border-radius: 16px;
      text-decoration: none;
      color: #06110e;
      background: #7cf7d4;
      font-weight: 800;
      text-align: center;
    }
    a.secondary {
      color: #f7f7fb;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.16);
    }
    code {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <h1>우당탕탕 추리게임 DEMO</h1>
    <p>
      이 파일은 AR 인터페이스 테스트 연결용 간단 메인입니다.
      <code>fake-ar.html</code>은 <code>targets.mind</code> 없이 카메라 화면 위에 단서 UI를 띄우는 버전입니다.
    </p>
    <div class="grid">
      <a href="./fake-ar.html">타겟 없는 AR 인터페이스 테스트</a>
      <a class="secondary" href="./ar-photo.html">MindAR 이미지 인식 AR 페이지</a>
    </div>
  </main>
</body>
</html>
