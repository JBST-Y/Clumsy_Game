<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>친구와 여행 성향 분석</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #16181d;
      --muted: #6b7280;
      --line: #e5e7eb;
      --dark: #111827;
      --accent: #2563eb;
      --danger: #dc2626;
      --soft: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08);
    }

    h1, h2, h3 { margin-top: 0; }
    h1 { font-size: 28px; line-height: 1.3; }
    h2 { font-size: 23px; line-height: 1.5; }
    h3 { font-size: 19px; }

    p {
      line-height: 1.65;
      color: #4b5563;
    }

    .sub {
      font-size: 14px;
      color: var(--muted);
    }

    .notice {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .warning {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
    }

    .mission-box {
      border: 2px solid var(--dark);
      border-radius: 18px;
      padding: 22px;
      margin: 20px 0;
      background: #fff;
    }

    .mission-box strong {
      display: block;
      margin-bottom: 10px;
      font-size: 20px;
    }

    input, select, button {
      width: 100%;
      border-radius: 14px;
      font-size: 16px;
    }

    input, select {
      padding: 15px;
      border: 1px solid #d1d5db;
      background: #fff;
      margin-top: 10px;
    }

    button {
      padding: 15px;
      border: 0;
      margin-top: 12px;
      cursor: pointer;
      background: var(--dark);
      color: white;
      font-weight: 700;
    }

    button.secondary {
      background: #eef2f7;
      color: var(--text);
      border: 1px solid var(--line);
    }

    button.option {
      background: #f8fafc;
      color: var(--text);
      border: 1px solid var(--line);
      text-align: left;
      font-weight: 600;
    }

    button.option:hover {
      background: #eef2f7;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .error {
      color: var(--danger);
      font-size: 14px;
      margin-top: 10px;
    }

    .progress-track {
      height: 8px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 100%;
      background: var(--dark);
      transition: width 0.25s ease;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .result-type {
      font-size: 28px;
      font-weight: 900;
      margin: 10px 0 4px;
    }

    .team-box {
      margin-top: 22px;
      padding: 24px;
      border-radius: 18px;
      background: var(--dark);
      color: white;
      text-align: center;
    }

    .team-box .label {
      font-size: 13px;
      opacity: 0.75;
    }

    .team-box .team {
      font-size: 32px;
      font-weight: 900;
      margin-top: 6px;
    }

    .lock {
      text-align: center;
      padding: 26px 0;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .checkbox-row input {
      width: auto;
      margin: 3px 0 0;
    }

    .tiny {
      font-size: 12px;
      color: var(--muted);
      margin-top: 18px;
    }
  </style>
</head>

<body>
<div class="wrap">
  <main class="card" id="app"></main>
</div>

<script>
  /*
    ==========================================================
    테스트용 설정
    ==========================================================
    1. 팀은 여기서 원하는 조합으로 바꾸면 됩니다.
    2. PIN은 각 참가자에게 개인적으로 알려주세요.
    3. 개인미션은 missions에서 원하는 사람만 설정하면 됩니다.
  */

  const participants = {
    A: { pin: "1111", team: "팀 1" },
    B: { pin: "2222", team: "팀 1" },
    C: { pin: "3333", team: "팀 1" },
    D: { pin: "4444", team: "팀 1" },
    E: { pin: "5555", team: "팀 2" },
    F: { pin: "6666", team: "팀 2" },
    G: { pin: "7777", team: "팀 2" },
    H: { pin: "8888", team: "팀 2" }
  };

  const missions = {
    C: "목적지 도착 전 뜨거운 아메리카노를 한 잔 구매하세요. 행동의 이유를 다른 사람에게 들키면 실패입니다.",
    F: "목적지 도착 전 화장실에 총 3회 방문하세요. 일부러 그러는 것처럼 보이면 실패입니다."
  };

  const questions = [
    {
      type: "trait",
      title: "여행지를 고른다면?",
      options: [
        { text: "산", scores: { adventure: 1 } },
        { text: "바다", scores: { freedom: 1 } }
      ]
    },
    {
      type: "trait",
      title: "여행 일정은 어느 쪽이 더 좋나요?",
      options: [
        { text: "시간대별로 미리 계획한다", scores: { plan: 2 } },
        { text: "큰 틀만 잡고 상황에 맞춘다", scores: { freedom: 2 } }
      ]
    },
    {
      type: "trait",
      title: "둘 중 하나를 고른다면?",
      options: [
        { text: "유명 맛집 1시간 웨이팅", scores: { experience: 2 } },
        { text: "바로 들어갈 수 있는 괜찮은 식당", scores: { efficiency: 2 } }
      ]
    },
    {
      type: "trait",
      title: "여행 중 갑자기 재미있는 장소를 발견했다면?",
      options: [
        { text: "일정을 바꿔서라도 가본다", scores: { adventure: 2, freedom: 1 } },
        { text: "원래 계획을 우선한다", scores: { plan: 2 } }
      ]
    },
    {
      type: "peer",
      title: "친구들 중 가장 고집이 센 사람 1위는?",
      options: ["A", "B", "C", "D", "E", "F", "G", "H"]
    },
    {
      type: "trait",
      title: "여행에서 가장 아까운 것은?",
      options: [
        { text: "돈을 많이 쓰는 것", scores: { efficiency: 2 } },
        { text: "좋은 경험을 놓치는 것", scores: { experience: 2 } }
      ]
    },
    {
      type: "peer",
      title: "친구들 중 여행 분위기를 가장 잘 띄우는 사람은?",
      options: ["A", "B", "C", "D", "E", "F", "G", "H"]
    },
    {
      type: "trait",
      title: "숙소를 고를 때 더 중요한 것은?",
      options: [
        { text: "깔끔하고 편안한 시설", scores: { comfort: 2 } },
        { text: "놀거리와 좋은 위치", scores: { experience: 2 } }
      ]
    },
    {
      type: "trait",
      title: "여행 중 예상치 못한 문제가 생겼다면?",
      options: [
        { text: "빠르게 해결 방법부터 찾는다", scores: { efficiency: 2 } },
        { text: "일단 웃고 상황을 즐긴다", scores: { freedom: 2 } }
      ]
    },
    {
      type: "peer",
      title: "친구들 중 여행에 가장 늦게 올 것 같은 사람은?",
      options: ["A", "B", "C", "D", "E", "F", "G", "H"]
    },
    {
      type: "trait",
      title: "여행에서 액티비티가 있다면?",
      options: [
        { text: "웬만하면 다 해보고 싶다", scores: { adventure: 2 } },
        { text: "재미있어 보이는 것만 골라서 한다", scores: { comfort: 1, efficiency: 1 } }
      ]
    },
    {
      type: "trait",
      title: "친구들과 의견이 갈렸을 때 나는?",
      options: [
        { text: "내 의견을 적극적으로 설득한다", scores: { leadership: 2 } },
        { text: "다수가 원하는 쪽에 맞춘다", scores: { harmony: 2 } }
      ]
    },
    {
      type: "peer",
      title: "친구들 중 비밀을 가장 잘 지킬 것 같은 사람은?",
      options: ["A", "B", "C", "D", "E", "F", "G", "H"]
    },
    {
      type: "trait",
      title: "여행 사진은 어느 쪽에 가까운가요?",
      options: [
        { text: "사진을 많이 남기는 편", scores: { experience: 1, social: 1 } },
        { text: "눈으로 보는 게 더 중요하다", scores: { comfort: 1, freedom: 1 } }
      ]
    },
    {
      type: "trait",
      title: "게임이나 내기가 시작되면?",
      options: [
        { text: "이왕 하는 거 무조건 이기고 싶다", scores: { leadership: 1, adventure: 1 } },
        { text: "재미있으면 결과는 크게 상관없다", scores: { harmony: 1, freedom: 1 } }
      ]
    },
    {
      type: "peer",
      title: "마지막 질문. 이번 여행에서 가장 큰 변수를 만들 것 같은 사람은?",
      options: ["A", "B", "C", "D", "E", "F", "G", "H"]
    }
  ];

  const app = document.getElementById("app");

  let currentUser = null;
  let currentIndex = 0;
  let answers = [];
  let scores = {
    adventure: 0,
    freedom: 0,
    plan: 0,
    experience: 0,
    efficiency: 0,
    comfort: 0,
    leadership: 0,
    harmony: 0,
    social: 0
  };

  function renderLogin() {
    app.innerHTML = `
      <h1>친구와 여행 성향 분석</h1>
      <p>
        간단한 질문을 통해 여행 성향을 분석하고
        최종 팀을 결정합니다.
      </p>

      <div class="notice">
        예상 소요 시간은 약 5분입니다.<br>
        다른 사람과 상의하지 말고 본인의 생각대로 선택해주세요.
      </div>

      <label for="name">이름</label>
      <select id="name">
        <option value="">선택해주세요</option>
        ${Object.keys(participants).map(name => `<option value="${name}">${name}</option>`).join("")}
      </select>

      <label for="pin" style="display:block; margin-top:14px;">개인 확인번호</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4자리 확인번호">

      <button onclick="login()">테스트 시작</button>
      <div class="error" id="error"></div>

      <div class="tiny">
        본인 이름과 확인번호로만 참여할 수 있습니다.
      </div>
    `;
  }

  function login() {
    const name = document.getElementById("name").value;
    const pin = document.getElementById("pin").value.trim();
    const error = document.getElementById("error");

    if (!name || !participants[name]) {
      error.textContent = "등록된 참가자를 선택해주세요.";
      return;
    }

    if (participants[name].pin !== pin) {
      error.textContent = "확인번호가 일치하지 않습니다.";
      return;
    }

    currentUser = name;

    const finishedKey = `travel_test_finished_${currentUser}`;
    const storedResult = localStorage.getItem(finishedKey);

    if (storedResult) {
      const result = JSON.parse(storedResult);
      renderResult(result, true);
      return;
    }

    currentIndex = 0;
    answers = [];
    resetScores();
    renderQuestion();
  }

  function resetScores() {
    Object.keys(scores).forEach(key => scores[key] = 0);
  }

  function renderQuestion() {
    if (currentIndex >= questions.length) {
      finishQuestions();
      return;
    }

    const q = questions[currentIndex];
    const progress = Math.round(((currentIndex) / questions.length) * 100);

    const optionsHtml = q.options.map((option, idx) => {
      const label = typeof option === "string" ? option : option.text;
      return `<button class="option" onclick="selectAnswer(${idx})">${label}</button>`;
    }).join("");

    app.innerHTML = `
      <div class="progress-track">
        <div class="progress-bar" style="width:${progress}%"></div>
      </div>

      <div class="progress-text">
        <span>${currentIndex + 1} / ${questions.length}</span>
        <span>약 ${Math.max(1, Math.ceil((questions.length - currentIndex) * 0.28))}분 남음</span>
      </div>

      <h2>${q.title}</h2>
      <p class="sub">가장 가까운 답을 하나 선택해주세요.</p>

      ${optionsHtml}
    `;
  }

  function selectAnswer(optionIndex) {
    const q = questions[currentIndex];
    const selected = q.options[optionIndex];

    if (q.type === "trait" && typeof selected !== "string") {
      Object.entries(selected.scores || {}).forEach(([key, value]) => {
        scores[key] = (scores[key] || 0) + value;
      });
      answers.push(selected.text);
    } else {
      answers.push(typeof selected === "string" ? selected : selected.text);
    }

    currentIndex++;
    renderQuestion();
  }

  function finishQuestions() {
    if (missions[currentUser]) {
      const seenKey = `travel_test_mission_seen_${currentUser}`;

      if (!localStorage.getItem(seenKey)) {
        renderMission();
        return;
      }
    }

    finalizeResult();
  }

  function renderMission() {
    app.innerHTML = `
      <div class="progress-track">
        <div class="progress-bar" style="width:100%"></div>
      </div>

      <div class="progress-text">
        <span>분석 완료</span>
        <span>결과 확인 전 마지막 안내</span>
      </div>

      <h2>${currentUser}님에게만 공개되는 추가 안내입니다.</h2>

      <div class="notice warning">
        이 페이지는 확인 후 다시 볼 수 없습니다.<br>
        아래 내용을 반드시 정확하게 기억해주세요.
      </div>

      <div class="mission-box">
        <strong>개인 행동 지침</strong>
        ${missions[currentUser]}
      </div>

      <p>
        다른 사람에게 이 화면을 보여주거나 내용을 직접 공개하지 마세요.
        확인을 완료하면 바로 성향 분석 결과와 팀이 공개됩니다.
      </p>

      <label class="checkbox-row">
        <input id="missionCheck" type="checkbox" onchange="toggleMissionButton()">
        <span>내용을 정확히 확인했으며, 이후 다시 확인할 수 없다는 점을 이해했습니다.</span>
      </label>

      <button id="missionConfirmBtn" disabled onclick="confirmMission()">
        기억했습니다. 결과 확인하기
      </button>
    `;
  }

  function toggleMissionButton() {
    const checked = document.getElementById("missionCheck").checked;
    document.getElementById("missionConfirmBtn").disabled = !checked;
  }

  function confirmMission() {
    const seenKey = `travel_test_mission_seen_${currentUser}`;
    localStorage.setItem(seenKey, "true");
    finalizeResult();
  }

  function getPersonality() {
    const entries = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const top = entries[0][0];

    const types = {
      adventure: {
        name: "도전형 여행자",
        desc: "새로운 장소와 활동을 발견하면 직접 부딪혀보는 스타일입니다. 예상 밖의 상황도 여행의 재미로 받아들이는 편입니다."
      },
      freedom: {
        name: "자유형 여행자",
        desc: "정해진 계획보다 그날의 분위기와 상황을 중요하게 생각합니다. 즉흥적인 변화에서도 재미를 잘 찾는 편입니다."
      },
      plan: {
        name: "설계형 여행자",
        desc: "동선과 시간을 효율적으로 정리해 여행의 완성도를 높이는 스타일입니다. 준비가 되어 있을수록 더 편하게 즐깁니다."
      },
      experience: {
        name: "경험수집형 여행자",
        desc: "돈이나 시간보다 기억에 남는 경험을 중요하게 생각합니다. 여행에서 새로운 장면을 만드는 것을 좋아합니다."
      },
      efficiency: {
        name: "실속형 여행자",
        desc: "시간과 비용을 낭비하지 않으면서 만족도를 높이는 데 능한 스타일입니다. 현실적인 판단이 빠른 편입니다."
      },
      comfort: {
        name: "힐링형 여행자",
        desc: "빡빡한 일정과 무리한 활동보다는 편안하게 오래 즐길 수 있는 여행을 선호합니다."
      },
      leadership: {
        name: "주도형 여행자",
        desc: "결정이 필요할 때 적극적으로 의견을 내고 팀을 움직이는 스타일입니다. 승부와 도전에서도 존재감이 큽니다."
      },
      harmony: {
        name: "조율형 여행자",
        desc: "친구들의 의견을 살피고 모두가 즐길 수 있는 선택을 만드는 스타일입니다. 함께하는 분위기를 중요하게 생각합니다."
      },
      social: {
        name: "기록형 여행자",
        desc: "여행의 순간을 사진과 이야기로 남기고 친구들과 공유하는 것을 좋아하는 스타일입니다."
      }
    };

    return types[top] || types.freedom;
  }

  function finalizeResult() {
    const personality = getPersonality();
    const result = {
      user: currentUser,
      personality,
      team: participants[currentUser].team
    };

    localStorage.setItem(
      `travel_test_finished_${currentUser}`,
      JSON.stringify(result)
    );

    renderResult(result, false);
  }

  function renderResult(result, revisited) {
    app.innerHTML = `
      <div class="progress-track">
        <div class="progress-bar" style="width:100%"></div>
      </div>

      <div class="progress-text">
        <span>성향 분석 완료</span>
        <span>${result.user}</span>
      </div>

      <p class="sub">당신의 여행 성향은</p>
      <div class="result-type">${result.personality.name}</div>
      <p>${result.personality.desc}</p>

      <div class="team-box">
        <div class="label">최종 배정 팀</div>
        <div class="team">${result.team}</div>
      </div>

      <div class="notice" style="margin-top:20px;">
        팀 배정이 완료되었습니다.<br>
        다른 참가자의 결과를 확인하려고 하지 마세요.
      </div>

      ${revisited ? `
        <div class="tiny">
          이미 테스트를 완료한 참가자입니다. 개인 행동 지침은 다시 표시되지 않습니다.
        </div>
      ` : ""}
    `;
  }

  renderLogin();
</script>
</body>
</html>
